services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: family_tree
      POSTGRES_USER: family
      POSTGRES_PASSWORD: family
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family_tree"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://family:family@db:5432/family_tree?schema=public
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret}
      PORT: 4000
      FRONTEND_URL: http://localhost:8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:4000/api
    depends_on:
      - backend
    ports:
      - "8080:80"
volumes:
  postgres_data:
